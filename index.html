<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deal Sealers — Spin Wheel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0A0F1E;
    --bg-mid:#121A30;
    --surface:#182140;
    --surface-2:#1E2A4D;
    --border:#2C3860;
    --text-primary:#F3F5FB;
    --text-dim:#8C98BE;
    --gold:#F2B84B;
    --gold-soft:#F7D48A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 50% -10%, var(--bg-mid), var(--bg-deep) 65%);
    font-family:'Inter', -apple-system, sans-serif;
    color:var(--text-primary);
    padding:2.5rem 1.25rem 3rem;
  }
  h1,h2{font-family:'Space Grotesk', 'Inter', sans-serif; margin:0;}

  .stage{max-width:980px; margin:0 auto;}
  .top{text-align:center; margin-bottom:2.25rem;}
  .top h1{font-size:clamp(1.6rem, 3.4vw, 2.2rem); font-weight:600; letter-spacing:-0.01em;}
  .top p{color:var(--text-dim); font-size:0.95rem; max-width:480px; margin:0.6rem auto 0; line-height:1.5;}

  .layout{
    display:flex;
    gap:2.5rem;
    align-items:flex-start;
    justify-content:center;
    flex-wrap:wrap;
  }

  /* ---------- Wheel panel ---------- */
  .wheel-panel{text-align:center; flex:0 0 auto;}
  #ringWrap{position:relative; width:360px; height:360px; margin:0 auto; border-radius:50%;}
  #pointer{
    position:absolute; top:-6px; left:50%; transform:translateX(-50%); z-index:3;
    width:0; height:0;
    border-left:15px solid transparent; border-right:15px solid transparent;
    border-top:26px solid var(--gold);
    filter:drop-shadow(0 2px 4px rgba(0,0,0,0.4));
  }
  #wheel{width:360px; height:360px; display:block; border-radius:50%; transition:filter 0.4s ease;}
  #wheel.wheel-blurred{filter:blur(6px);}
  #hub{fill:var(--surface-2); stroke:var(--border); stroke-width:1.5;}

  @keyframes glowPulse{
    0%,100%{ box-shadow:0 0 0 6px var(--glow-color, var(--gold)); }
    50%{ box-shadow:0 0 0 15px var(--glow-color, #378ADD); }
  }
  .spinning-ring{animation:glowPulse 0.32s ease-in-out infinite;}

  #countdownLayer{position:absolute; inset:0; pointer-events:none; z-index:2;}
  .count-num{
    position:absolute; top:50%; left:50%;
    font-family:'Space Grotesk', sans-serif;
    font-size:88px; font-weight:600; color:var(--text-primary);
    text-shadow:0 0 24px rgba(242,184,75,0.5);
    animation:numberPop 0.9s ease-out forwards;
  }
  @keyframes numberPop{
    0%{ transform:translate(-50%,-50%) scale(0.2); opacity:0; }
    40%{ transform:translate(-50%,-50%) scale(1.15); opacity:1; }
    80%{ transform:translate(-50%,-50%) scale(1); opacity:1; }
    100%{ transform:translate(-50%,-50%) scale(1); opacity:0; }
  }

  #revealWrap{position:absolute; inset:0; pointer-events:none; z-index:10;}
  @keyframes popIn{
    0%{ transform:translate(-50%,-50%) scale(0.3); opacity:0; }
    60%{ transform:translate(-50%,-50%) scale(1.08); opacity:1; }
    100%{ transform:translate(-50%,-50%) scale(1); opacity:1; }
  }
  .reveal-card{
    animation:popIn 0.5s cubic-bezier(0.34,1.56,0.64,1);
    position:absolute; top:50%; left:50%;
    background:var(--surface); border:1px solid var(--border);
    border-radius:18px; padding:1.5rem 1.75rem;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    width:270px; box-sizing:border-box;
    box-shadow:0 20px 50px rgba(0,0,0,0.5);
  }
  .avatar{
    width:56px; height:56px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:20px; color:#0A0F1E;
    box-shadow:0 0 0 4px rgba(242,184,75,0.35);
  }
  .reveal-eyebrow{font-size:12px; color:var(--gold-soft); margin:2px 0 0;}
  .reveal-name{font-family:'Space Grotesk', sans-serif; font-size:21px; font-weight:600; text-align:center; line-height:1.25; margin:0;}
  .reveal-sub{font-size:12.5px; color:var(--text-dim); margin:0;}

  .confetti{position:absolute; top:50%; left:50%; width:8px; height:8px; border-radius:2px; animation:confettiPop 1.1s ease-out forwards;}
  @keyframes confettiPop{
    0%{ transform:translate(0,0) rotate(0deg) scale(0.4); opacity:1; }
    100%{ transform:translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(1); opacity:0; }
  }

  #spinBtn{
    margin-top:2rem; font-family:'Space Grotesk', sans-serif;
    font-size:17px; font-weight:600; padding:14px 38px;
    display:inline-flex; align-items:center; gap:10px;
    background:var(--gold); color:#1A1300; border:none; border-radius:999px;
    cursor:pointer; transition:transform 0.15s ease, opacity 0.15s ease;
  }
  #spinBtn:hover:not(:disabled){transform:translateY(-1px);}
  #spinBtn:disabled{opacity:0.4; cursor:not-allowed;}
  #spinBtn:focus-visible{outline:2px solid var(--gold-soft); outline-offset:3px;}

  #resetBtn{
    margin-top:0.9rem; display:block; margin-left:auto; margin-right:auto;
    background:none; border:1px solid var(--border); color:var(--text-dim);
    font-family:'Inter', sans-serif; font-size:13px; padding:8px 18px;
    border-radius:999px; cursor:pointer; transition:border-color 0.15s ease, color 0.15s ease;
  }
  #resetBtn:hover{border-color:var(--text-dim); color:var(--text-primary);}
  #resetBtn:focus-visible{outline:2px solid var(--gold-soft); outline-offset:3px;}

  #roundBanner{
    margin-top:1rem; font-size:13px; color:var(--gold-soft);
    min-height:1.2em;
  }

  /* ---------- Roster panel ---------- */
  .roster-panel{
    flex:1 1 300px; max-width:340px;
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:1.1rem 1.2rem 1.3rem;
  }
  .roster-panel h2{font-size:14px; font-weight:600; color:var(--text-dim); margin-bottom:0.85rem;}
  .roster-list{
    display:grid; grid-template-columns:1fr 1fr; gap:0.15rem 0.9rem;
    max-height:420px; overflow-y:auto; padding-right:2px;
  }
  .roster-row{
    display:flex; align-items:center; gap:8px;
    padding:6px 4px; border-radius:8px;
    font-size:12.5px; transition:opacity 0.3s ease;
  }
  .roster-row.exhausted{opacity:0.32;}
  .roster-dot{width:9px; height:9px; border-radius:50%; flex:0 0 auto;}
  .roster-name{flex:1 1 auto; line-height:1.25; overflow-wrap:anywhere;}
  .pips{display:flex; gap:3px; flex:0 0 auto;}
  .pip{width:6px; height:6px; border-radius:50%; background:var(--border);}
  .pip.filled{background:var(--gold);}

  @media (max-width:760px){
    .layout{flex-direction:column; align-items:center;}
    .roster-panel{max-width:360px; width:100%;}
  }
  @media (prefers-reduced-motion:reduce){
    .spinning-ring{animation:none;}
    .count-num, .reveal-card{animation:none;}
  }
</style>
</head>
<body>

<div class="stage">
  <div class="top">
    <h1>Deal Sealers — Spin the Wheel</h1>
    <p>Spin to put a teammate in the spotlight. Everyone gets up to two turns per round — once you've had two, you sit out until it's reset.</p>
  </div>

  <div class="layout">
    <div class="wheel-panel">
      <div id="ringWrap">
        <div id="pointer"></div>
        <svg id="wheel" viewBox="0 0 300 300">
          <g id="segments"></g>
          <circle id="hub" cx="150" cy="150" r="24"/>
        </svg>
        <div id="countdownLayer"></div>
        <div id="revealWrap"></div>
      </div>
      <button id="spinBtn">Spin the wheel</button>
      <button id="resetBtn">Reset the round</button>
      <div id="roundBanner"></div>
    </div>

    <aside class="roster-panel">
      <h2>Roster — spins remaining</h2>
      <div class="roster-list" id="rosterList"></div>
    </aside>
  </div>
</div>

<script>
/* ---------- Roster & color assignment ---------- */
const rawNames = [
  "Milly Nakkazi", "Florence Kaudha", "Mercy Atusasiire", "Manita Joan",
  "Akademere Stella Slyvia", "GraceMary Nakabiito", "Flavia Nangonzi",
  "Racheal Nabyonga Kisakye", "Sarah Akello Flishia", "Gloria Nahirya",
  "Angella Athieno", "Elizabeth Akampurira", "Kenneth Birungi", "Babirye Violla",
  "Natasha Nakiyaga", "Patience Nyamwiza", "David Wasen", "Elizabeth Kemigisa",
  "Oliver Natoolo", "Emily Namara", "Anitah Nalugwa", "Birungi Nuwagaba",
  "Beatrice Nakkazi", "Arthur Ssemwezzi", "Rinah Kabahuma", "Jupiter Atuhaire",
  "Irene Nabagala", "Babra Nazziwa", "Nalumansi Josephine", "Raymond Twino",
  "Rachael Nankya", "Doreen Kyasiimire", "Frank Mugoloza", "Peter Kakuru",
  "Apio Cissy", "Godivah Ampumuza", "Abesiga Muhabuzi", "Martin Tweteise",
  "Latifa Apio", "Namatovu Rachel", "Priscilla Nakimbugwe", "Allan Otim",
  "Fatumah Arinaitwe", "Daphine Nanyonjo", "Asuman",
  "Emmanuel", "Jovia", "Jonathan"
];

function colorForIndex(i){
  const hue = (206 + i * 137.508) % 360;
  const light = 38 + (i % 3) * 6; // 38 / 44 / 50
  return `hsl(${hue.toFixed(1)} 62% ${light}%)`;
}

function initialsFor(name){
  const tokens = name.trim().split(/\s+/).filter(Boolean);
  if (tokens.length === 1) return (tokens[0][0] + (tokens[0][1] || '')).toUpperCase();
  return (tokens[0][0] + tokens[tokens.length - 1][0]).toUpperCase();
}

const MAX_TURNS = 2;
const masterPool = rawNames.map((name, i) => ({
  name,
  color: colorForIndex(i),
  remaining: MAX_TURNS
}));

/* ---------- Wheel state ---------- */
const wheel = document.getElementById('wheel');
const segEl = document.getElementById('segments');
const btn = document.getElementById('spinBtn');
const resetBtn = document.getElementById('resetBtn');
const roundBanner = document.getElementById('roundBanner');
const revealWrap = document.getElementById('revealWrap');
const ringWrap = document.getElementById('ringWrap');
const countdownLayer = document.getElementById('countdownLayer');
const rosterList = document.getElementById('rosterList');

let activeList = [];
let seg = 0;
let n = 0;
let rotation = 0;
let spinning = false;
let colorFlashTimer = null;

function toRad(a){ return (a - 90) * Math.PI / 180; }

function fontSizeFor(name){
  const len = name.length;
  if (len <= 12) return 10.5;
  if (len <= 18) return 9.5;
  if (len <= 24) return 8.2;
  return 7.2;
}

function buildWheel(){
  activeList = masterPool.filter(p => p.remaining > 0);
  n = activeList.length;
  seg = n ? 360 / n : 360;
  segEl.innerHTML = '';

  activeList.forEach((item, i) => {
    const startAngle = i * seg;
    const endAngle = startAngle + seg;
    const x1 = 150 + 140 * Math.cos(toRad(startAngle));
    const y1 = 150 + 140 * Math.sin(toRad(startAngle));
    const x2 = 150 + 140 * Math.cos(toRad(endAngle));
    const y2 = 150 + 140 * Math.sin(toRad(endAngle));
    const largeArc = seg > 180 ? 1 : 0;

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M150,150 L${x1},${y1} A140,140 0 ${largeArc},1 ${x2},${y2} Z`);
    path.setAttribute('fill', item.color);
    path.setAttribute('stroke', 'var(--bg-deep)');
    path.setAttribute('stroke-width', '1');
    segEl.appendChild(path);

    const midAngle = startAngle + seg / 2;
    const innerR = 44;
    const tx = 150 + innerR * Math.cos(toRad(midAngle));
    const ty = 150 + innerR * Math.sin(toRad(midAngle));
    const rotateDeg = midAngle - 90;

    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', tx);
    text.setAttribute('y', ty);
    text.setAttribute('fill', '#ffffff');
    text.setAttribute('font-size', fontSizeFor(item.name));
    text.setAttribute('font-family', "'Inter', sans-serif");
    text.setAttribute('font-weight', '600');
    text.setAttribute('dominant-baseline', 'middle');
    text.setAttribute('transform', `rotate(${rotateDeg}, ${tx}, ${ty})`);
    text.textContent = item.name;
    segEl.appendChild(text);
  });
}

function renderRoster(){
  rosterList.innerHTML = '';
  masterPool.forEach(item => {
    const row = document.createElement('div');
    row.className = 'roster-row' + (item.remaining === 0 ? ' exhausted' : '');
    const dot = document.createElement('span');
    dot.className = 'roster-dot';
    dot.style.background = item.color;
    const nameEl = document.createElement('span');
    nameEl.className = 'roster-name';
    nameEl.textContent = item.name;
    const pips = document.createElement('span');
    pips.className = 'pips';
    for (let p = 0; p < MAX_TURNS; p++) {
      const pip = document.createElement('span');
      pip.className = 'pip' + (p < item.remaining ? ' filled' : '');
      pips.appendChild(pip);
    }
    row.appendChild(dot);
    row.appendChild(nameEl);
    row.appendChild(pips);
    rosterList.appendChild(row);
  });
}

function checkRoundState(){
  const anyLeft = masterPool.some(p => p.remaining > 0);
  btn.disabled = !anyLeft;
  roundBanner.textContent = anyLeft ? '' : 'Everyone\u2019s had two turns \u2014 reset to spin again.';
}

/* ---------- Audio engine ---------- */
let audioCtx = null;

function kick(t){
  const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
  o.frequency.setValueAtTime(140, t);
  o.frequency.exponentialRampToValueAtTime(45, t + 0.15);
  g.gain.setValueAtTime(0.25, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + 0.25);
}
function makeNoiseBuffer(seconds){
  const bufferSize = Math.floor(audioCtx.sampleRate * seconds);
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  return buffer;
}
function hat(t){
  const src = audioCtx.createBufferSource();
  src.buffer = makeNoiseBuffer(0.05);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.06, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
  src.connect(g); g.connect(audioCtx.destination);
  src.start(t);
}
function tick(){
  if (!audioCtx) return;
  const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
  o.frequency.value = 900; o.type = 'square';
  g.gain.setValueAtTime(0.05, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + 0.05);
}
function countBeep(t){
  const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
  o.frequency.value = 520; o.type = 'sine';
  g.gain.setValueAtTime(0.001, t);
  g.gain.exponentialRampToValueAtTime(0.15, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + 0.22);
}
function startBeat(duration){
  const startT = audioCtx.currentTime + 0.05;
  const bpm = 128; const beatLen = 60 / bpm;
  const totalBeats = Math.floor(duration / (beatLen * 1000));
  for (let b = 0; b < totalBeats; b++) {
    const t = startT + b * beatLen;
    kick(t); hat(t + beatLen / 2);
  }
}
function dropSound(){
  const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(400, audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.6);
  g.gain.setValueAtTime(0.001, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.2, audioCtx.currentTime + 0.05);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.7);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + 0.7);
}
function celebrationPop(t, pitch){
  const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(pitch, t);
  o.frequency.exponentialRampToValueAtTime(pitch * 0.45, t + 0.09);
  g.gain.setValueAtTime(0.001, t);
  g.gain.linearRampToValueAtTime(0.22, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.11);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + 0.12);

  const clickSrc = audioCtx.createBufferSource();
  clickSrc.buffer = makeNoiseBuffer(0.015);
  const clickFilt = audioCtx.createBiquadFilter();
  clickFilt.type = 'highpass'; clickFilt.frequency.value = 3000;
  const clickGain = audioCtx.createGain();
  clickGain.gain.setValueAtTime(0.15, t);
  clickGain.gain.exponentialRampToValueAtTime(0.001, t + 0.02);
  clickSrc.connect(clickFilt); clickFilt.connect(clickGain); clickGain.connect(audioCtx.destination);
  clickSrc.start(t); clickSrc.stop(t + 0.02);
}
function crowdCheer(){
  const t0 = audioCtx.currentTime; const dur = 2.2;
  const roarSrc = audioCtx.createBufferSource();
  roarSrc.buffer = makeNoiseBuffer(dur);
  const roarGain = audioCtx.createGain();
  roarGain.gain.setValueAtTime(0.001, t0);
  roarGain.gain.exponentialRampToValueAtTime(0.14, t0 + 0.25);
  roarGain.gain.setValueAtTime(0.14, t0 + 1.0);
  roarGain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  [800, 1400, 2200].forEach(freq => {
    const filt = audioCtx.createBiquadFilter();
    filt.type = 'bandpass'; filt.frequency.value = freq; filt.Q.value = 0.7;
    roarSrc.connect(filt); filt.connect(roarGain);
  });
  roarGain.connect(audioCtx.destination);
  roarSrc.start(t0); roarSrc.stop(t0 + dur);

  for (let i = 0; i < 20; i++) {
    const ct = t0 + 0.08 + Math.random() * 1.5;
    const clapSrc = audioCtx.createBufferSource();
    clapSrc.buffer = makeNoiseBuffer(0.05);
    const clapFilt = audioCtx.createBiquadFilter();
    clapFilt.type = 'bandpass'; clapFilt.frequency.value = 2200 + Math.random() * 1800; clapFilt.Q.value = 2.5;
    const clapFilt2 = audioCtx.createBiquadFilter();
    clapFilt2.type = 'highpass'; clapFilt2.frequency.value = 1500;
    const clapGain = audioCtx.createGain();
    clapGain.gain.setValueAtTime(0.001, ct);
    clapGain.gain.linearRampToValueAtTime(0.38, ct + 0.004);
    clapGain.gain.exponentialRampToValueAtTime(0.001, ct + 0.07);
    clapSrc.connect(clapFilt); clapFilt.connect(clapFilt2); clapFilt2.connect(clapGain); clapGain.connect(audioCtx.destination);
    clapSrc.start(ct); clapSrc.stop(ct + 0.07);
  }
  const popPitches = [900, 1100, 1300, 1500, 1700];
  for (let i = 0; i < 9; i++) {
    const pt = t0 + 0.05 + Math.random() * 1.6;
    celebrationPop(pt, popPitches[Math.floor(Math.random() * popPitches.length)]);
  }
}

let femaleVoice = null;
function pickFemaleVoice(){
  if (!('speechSynthesis' in window)) return;
  const voices = window.speechSynthesis.getVoices();
  femaleVoice = voices.find(v => /female/i.test(v.name))
    || voices.find(v => /(samantha|victoria|zira|susan|karen|moira|tessa|fiona|google uk english female|google us english)/i.test(v.name))
    || voices.find(v => v.lang && v.lang.startsWith('en'))
    || voices[0] || null;
}
if ('speechSynthesis' in window) {
  pickFemaleVoice();
  window.speechSynthesis.onvoiceschanged = pickFemaleVoice;
}
function announce(text){
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  if (femaleVoice) utter.voice = femaleVoice;
  utter.pitch = 1.1; utter.rate = 0.97;
  window.speechSynthesis.speak(utter);
}

function burstConfetti(container, color){
  const colors = ['#F2B84B', '#F7D48A', '#ffffff', color];
  for (let i = 0; i < 40; i++) {
    const p = document.createElement('div');
    p.className = 'confetti';
    const angle = Math.random() * Math.PI * 2;
    const dist = 90 + Math.random() * 110;
    p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    p.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDelay = (Math.random() * 0.15) + 's';
    container.appendChild(p);
    setTimeout(() => p.remove(), 1400);
  }
}

/* ---------- Spin mechanics ---------- */
function showCountNumber(num, t){
  setTimeout(() => {
    countdownLayer.innerHTML = '<div class="count-num">' + num + '</div>';
    if (audioCtx) countBeep(audioCtx.currentTime);
  }, t);
}

function angleToIndex(rot){
  const pointerOriginalAngle = ((360 - (rot % 360)) % 360 + 360) % 360;
  return Math.floor(pointerOriginalAngle / seg) % n;
}

btn.onclick = () => {
  if (spinning || n === 0) return;
  spinning = true;
  revealWrap.innerHTML = '';
  countdownLayer.innerHTML = '';
  roundBanner.textContent = '';
  wheel.classList.remove('wheel-blurred');
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  btn.disabled = true;
  btn.style.opacity = '0.6';
  resetBtn.disabled = true;

  const duration = 7800;
  startBeat(duration);
  ringWrap.classList.add('spinning-ring');
  let flashIdx = 0;
  const flashColors = activeList.map(it => it.color);
  colorFlashTimer = setInterval(() => {
    ringWrap.style.setProperty('--glow-color', flashColors[flashIdx % flashColors.length]);
    flashIdx++;
  }, 180);

  showCountNumber(3, duration - 3000);
  showCountNumber(2, duration - 2000);
  showCountNumber(1, duration - 1000);

  const extraSpins = 10 + Math.random() * 3;
  const randomOffset = Math.random() * 360;
  const startRotation = rotation;
  const baseFull = startRotation - (startRotation % 360);
  const finalRotation = baseFull + extraSpins * 360 + randomOffset;
  const delta = finalRotation - startRotation;
  const startTime = performance.now();
  let lastTickSeg = -1;

  function animate(now){
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 4.2);
    const current = startRotation + delta * eased;
    wheel.style.transform = `rotate(${current}deg)`;
    const segNow = angleToIndex(current);
    if (segNow !== lastTickSeg) { tick(); lastTickSeg = segNow; }
    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      rotation = finalRotation;
      spinning = false;
      resetBtn.disabled = false;
      ringWrap.classList.remove('spinning-ring');
      ringWrap.style.boxShadow = 'none';
      countdownLayer.innerHTML = '';
      clearInterval(colorFlashTimer);
      dropSound();
      crowdCheer();

      const winningIndex = angleToIndex(finalRotation);
      const picked = activeList[winningIndex];
      picked.remaining -= 1;

      wheel.classList.add('wheel-blurred');
      const firstName = picked.name.split(' ')[0];
      const remainingLabel = picked.remaining === 0
        ? 'That was their second turn — sitting out the rest of this round.'
        : `${picked.remaining} spin left this round.`;

      revealWrap.innerHTML = `
        <div class="reveal-card">
          <div class="avatar" style="background:${picked.color};">${initialsFor(picked.name)}</div>
          <p class="reveal-eyebrow">In the spotlight</p>
          <p class="reveal-name">${picked.name}</p>
          <p class="reveal-sub">${remainingLabel}</p>
        </div>
      `;
      burstConfetti(revealWrap, picked.color);
      announce(`${firstName} is in the spotlight!`);

      renderRoster();
      buildWheel();
      checkRoundState();
      btn.style.opacity = '1';
    }
  }
  requestAnimationFrame(animate);
};

resetBtn.onclick = () => {
  if (spinning) return;
  masterPool.forEach(p => p.remaining = MAX_TURNS);
  revealWrap.innerHTML = '';
  wheel.classList.remove('wheel-blurred');
  rotation = 0;
  wheel.style.transform = 'rotate(0deg)';
  renderRoster();
  buildWheel();
  checkRoundState();
};

/* ---------- Init ---------- */
renderRoster();
buildWheel();
checkRoundState();
</script>
</body>
</html>
